openapi: 3.2.0
info:
  title: Customer Classification Docs(.*) API
  description: API for triggering and retrieving classifications for products
  version: 1.0.0
servers:
- url: https://api.smartersorting.com
tags:
- name: Docs
paths:
  /docs(.*):
    get:
      summary: /docs proxy
      description: Redirect /docs host to new zudoku portal
      operationId: proxy-docs
      tags:
      - Docs
  /classification/v1/docs:
    get:
      x-internal: false
      summary: OpenAPI spec
      tags:
      - Docs
      operationId: customerClassificationAPIDocs
      responses:
        '200':
          description: The OpenAPI spec for the Customer Classification API v1.
          content:
            application/json:
              schema:
                type: object
                example:
                  openapi: 3.1.0
                  info:
                    title: OpenAPI Spec
                    description: This is a valid OpenAPI spec.
                    version: latest
                  servers: []
                  tags: []
                  paths: {}
components:
  securitySchemes:
    api_key:
      type: http
      scheme: bearer
