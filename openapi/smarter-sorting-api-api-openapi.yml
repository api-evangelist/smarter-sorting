openapi: 3.2.0
info:
  title: Customer Classification Api(.*) API
  description: API for triggering and retrieving classifications for products
  version: 1.0.0
servers:
- url: https://api.smartersorting.com
tags:
- name: api
paths:
  /api(.*):
    get:
      summary: /api proxy
      description: Proxy /api docs endpoints to new zudoku portal
      operationId: proxy-api-docs
      tags:
      - api
components:
  securitySchemes:
    api_key:
      type: http
      scheme: bearer
