- target: $.tags
  description: The spec declares no top-level tags[] although its operations are tagged.
  update:
  - name: products
    description: Submit product catalog entries and retrieve their regulatory classifications.
  - name: docs
    description: Self-describing contract endpoint.
- target: $.paths['/classification/v1/products/:upc']
  description: >-
    OBSERVATION, not a rewrite. The path templating uses Express-style `:upc` rather than the
    OpenAPI `{upc}` form. The parameter IS correctly declared as {name: upc, in: path, required:
    true}, so tooling that validates path-template/parameter agreement will flag a mismatch and
    some generators will emit a literal ":upc" segment. The live route accepts
    /classification/v1/products/<upc>.
  update:
    x-api-evangelist-note: >-
      Non-standard path templating — `:upc` should be `{upc}` per OpenAPI 3.1. Affects
      getProductByFieldMatch, putProductAttributesByIdentifier and
      patchProductAttributesByIdentifier.
- target: $.paths['/classification/v1/docs'].get
  description: >-
    Flag that this operation is the API's own self-describing contract endpoint — the reason this
    provider has a machine-readable contract at all, since no /openapi.json is served at the host
    root. Worth surfacing: it is anonymous and needs no key.
  update:
    x-api-evangelist-note: >-
      Anonymous, unauthenticated OpenAPI self-description. This is the canonical discovery URL for
      this API: https://api.smartersorting.com/classification/v1/docs
- target: $.components.securitySchemes.api_key
  description: Document how the bearer token is obtained; the spec states only the mechanism.
  update:
    description: >-
      HTTP bearer token. The key is generated for you when you sign in to the developer portal
      (https://api.smartersorting.com/docs) or the staging portal
      (https://api.staging.smarterx.com/docs) using Auth0 credentials. Send it as
      `Authorization: Bearer <API key>`. No key prefix distinguishes staging from production keys.
- target: $.components.schemas.ProblemDetails
  description: >-
    Record the two extension members the LIVE API returns beyond the RFC 9457 member set, observed
    on unauthenticated 401 and 404 responses.
  update:
    x-api-evangelist-observed-extensions:
      trace:
        timestamp: ISO 8601 timestamp of the error.
        requestId: Per-request UUID — the handle to quote to support.
        buildId: UUID of the deployed API build.
        rayId: Edge/CDN ray identifier.
- target: $.components.schemas.ProductAttributeOrClassification
  description: >-
    Record that the ~69 regulatory attribute names are documented only through
    components.examples.productExample and are not enumerable from the schema.
  update:
    x-api-evangelist-note: >-
      `value` is an untyped bag. The regulatory attribute vocabulary (dot_*, iata_*, imdg_*, nfpa_*,
      waste_rcra_codes, waste_state_codes, lithium/battery fields, flash_point, ph_min/ph_max,
      sds_link, ifc_codes) appears only in components.examples.productExample. Enumerated and mapped
      to its source standard in data-model/smarter-sorting-data-model.yml and
      conformance/smarter-sorting-conformance.yml.
- target: $.paths['/classification/v1/products/bulk'].post
  description: >-
    Record that the returned batchId is accepted by no published operation, and that there is no
    reversal path for an uploaded batch.
  update:
    x-api-evangelist-note: >-
      Returns BatchCreationResult {batchId}, but no operation in the published contract accepts a
      batchId — the batch can neither be polled nor cancelled by that identifier. There is no
      DELETE, cancel or undo on any path. See conventions/smarter-sorting-conventions.yml
      (reversibility).
