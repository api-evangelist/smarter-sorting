key_model:
  separate_test_keys: true
  detail: >-
    Keys are minted per portal. Signing in to the staging portal
    (https://api.staging.smarterx.com/docs) with Auth0 credentials generates a staging key; signing
    in to the production portal generates a production key. There is no documented key PREFIX
    convention (no `test_`/`live_` discriminator), so a key alone does not tell a caller — or an
    agent — which environment it addresses; only the host does.
  key_prefix_convention: none
test_fixtures:
  published: false
  detail: >-
    No test UPCs, no fixture catalog, no seeded sample products and no triggers for forcing a
    particular classification outcome are published. The getting-started page instead invites
    open-ended experimentation ("Try different products and Decisions to understand how our instant
    classifiers work with your inputs"), which means a caller cannot write a deterministic
    integration test against a known-answer product.
