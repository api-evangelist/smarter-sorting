aid: smarter-sorting
name: Smarter Sorting
description: Smarter Sorting (which rebranded as SmarterX in 2023 and now operates as part of Syndigo)
  is an Austin, Texas product-intelligence and regulatory-classification company serving retailers,
  consumer-goods brands and the logistics industry. Its Smarter-1 platform takes a customer's product
  catalog — at minimum a UPC and a product name — and returns machine-generated regulatory classifications
  covering hazardous-waste handling (RCRA waste codes and state waste codes), transport of dangerous
  goods (DOT, IATA and IMDG hazard classes, UN numbers, packing groups and proper shipping names), NFPA
  704 fire-diamond ratings, lithium-battery attributes and UN 38.3 documentation, so that a retailer
  can decide whether an item may be sold, shipped, donated, recycled, reclaimed or must be disposed
  of as regulated waste. The company publishes a public Customer Classification API (OpenAPI 3.1.0)
  alongside its Back of Store Solution (BOSS) platform, a developer portal, a staging environment and
  a public status page.
